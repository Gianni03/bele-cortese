<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OG · Bele Cortese</title>
    <link rel="stylesheet" href="fonts.css">
    <style>
      :root {
        --petrol: #002931;
        --coral: #F04444;
        --fuchsia: #E94FBA;
        --neon: #E8F000;
        --cream: #EDE4D1;
      }
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        background: var(--petrol);
        color: var(--cream);
        font-family: "Manrope", Arial, sans-serif;
      }
      .og {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 54px 64px 46px;
        background:
          radial-gradient(circle at 83% 48%, #003945 0 18%, transparent 52%),
          var(--petrol);
      }
      .art { position: absolute; inset: 0; overflow: hidden; }
      .blob {
        position: absolute;
        right: -82px;
        top: 82px;
        width: 470px;
        height: 470px;
        border-radius: 48% 52% 55% 45% / 44% 40% 60% 56%;
        background: var(--coral);
        transform: rotate(-12deg);
        box-shadow: inset -26px -34px 60px #8e1f1f55;
      }
      .ring {
        position: absolute;
        right: 74px;
        top: 128px;
        width: 330px;
        height: 330px;
        border: 3px solid var(--neon);
        border-radius: 52% 48% 41% 59% / 55% 62% 38% 45%;
        transform: rotate(18deg);
        opacity: .9;
      }
      .dot {
        position: absolute;
        right: 190px;
        top: 92px;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: var(--fuchsia);
      }
      .grid {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: 1fr 460px;
        align-items: center;
        width: 100%;
        height: 100%;
      }
      .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 34px; }
      .brand img { width: 78px; height: 80px; object-fit: contain; }
      .brand-copy { display: grid; gap: 4px; }
      .brand-name { font: 600 34px/.82 "Cormorant Garamond", Georgia, serif; letter-spacing: .04em; text-transform: uppercase; }
      .brand-name span { display: block; }
      .brand-slash { display: inline-block; width: 5px; height: 24px; margin-left: 4px; background: var(--neon); transform: skew(-18deg); vertical-align: -.12em; }
      .brand-role { color: #C9D6D2; font: 700 12px/1.2 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .16em; text-transform: uppercase; }
      .headline { margin: 0; color: var(--cream); font: 600 104px/.78 "Cormorant Garamond", Georgia, serif; letter-spacing: .01em; text-transform: uppercase; }
      .headline span { display: block; }
      .tagline {
        display: inline-block;
        margin-top: 22px;
        padding: 7px 14px 9px;
        background: var(--neon);
        color: #171717;
        font: 400 30px/1.1 "Special Elite", "Courier New", monospace;
        clip-path: polygon(1% 12%, 98% 0, 100% 84%, 3% 100%);
        transform: rotate(-1deg);
      }
      .descriptor {
        margin: 30px 0 0;
        max-width: 48ch;
        color: #D8E3DF;
        font: 700 17px/1.45 "Barlow Condensed", "Arial Narrow", sans-serif;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      .footer {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 32px;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        color: #AFC2BD;
        font: 700 13px/1.2 "Barlow Condensed", "Arial Narrow", sans-serif;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      .footer strong { color: var(--neon); font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="og" aria-label="Bele Cortese — Otra manera de mirar">
      <div class="art" aria-hidden="true">
        <div class="blob"></div>
        <div class="ring"></div>
        <div class="dot"></div>
      </div>
      <div class="grid">
        <div>
          <div class="brand">
            <img src="../Diseños/logosolo.png" alt="">
            <p class="brand-role">María Belén Cortese<br>Terapia ocupacional</p>
          </div>
          <h1 class="headline"><span>Bele</span><span>Cortese.</span></h1>
          <p class="tagline">Otra manera de mirar.</p>
          <p class="descriptor">Neurodiversidad · Inclusión · Accesibilidad</p>
        </div>
        <div></div>
      </div>
      <div class="footer">
        <span><strong>belencortese.com.ar</strong></span>
        <span>Una marca, cuatro recorridos</span>
      </div>
    </main>
  </body>
</html>
